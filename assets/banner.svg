<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="electric-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Green Energy Gradient -->
    <linearGradient id="green-energy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#1de9b6"/>
    </linearGradient>

    <!-- Purple Accent Gradient -->
    <linearGradient id="purple-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>

    <!-- Glow Filters with sRGB Color Interpolation -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style type="text/css">
    <![CDATA[
    .flow-line {
      stroke-dasharray: 12 8;
      animation: dash 20s linear infinite;
    }
    .floating-card {
      animation: float 4s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: float 5s ease-in-out infinite alternate-reverse;
    }

    @keyframes dash {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -1000; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    ]]>
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Dynamic Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="150" cy="100" r="180" fill="#00f2fe" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="220" fill="#7f00ff" opacity="0.15" filter="url(#glow)"/>
  <circle cx="950" cy="90" r="140" fill="#00e676" opacity="0.10" filter="url(#glow)"/>

  <!-- Dynamic Energy Flow Lines (Background Dynamic Layer) -->
  <path class="flow-line" d="M -50 320 Q 300 280 600 340 T 1250 260" fill="none" stroke="url(#electric-cyan)" stroke-width="3" opacity="0.6"/>
  <path class="flow-line" d="M -50 350 Q 450 390 800 310 T 1250 370" fill="none" stroke="url(#green-energy)" stroke-width="2" opacity="0.5"/>

  <!-- Decorative Graphic Element: EV Charging Wave / Node Diagram (Right Side) -->
  <g transform="translate(760, 60)">
    <!-- Connected Charging Nodes Network -->
    <path class="flow-line" d="M 50 150 L 140 80 L 250 130 L 320 60 L 370 170" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.7"/>

    <!-- Floating Node 1: OCPP 2.0.1 -->
    <g class="floating-card" transform="translate(20, 110)">
      <rect x="0" y="0" width="130" height="48" rx="10" fill="#132238" stroke="#00f2fe" stroke-width="1.5" opacity="0.9"/>
      <text x="65" y="29" text-anchor="middle" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">⚡ OCPP 2.0.1</text>
    </g>

    <!-- Floating Node 2: ISO 15118 / V2G -->
    <g class="floating-card-2" transform="translate(180, 30)">
      <rect x="0" y="0" width="140" height="48" rx="10" fill="#132238" stroke="#00e676" stroke-width="1.5" opacity="0.9"/>
      <text x="70" y="29" text-anchor="middle" fill="#00e676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">🔋 V2G &amp; Smart Grid</text>
    </g>

    <!-- Floating Node 3: CSMS / CPO Software -->
    <g class="floating-card" transform="translate(210, 150)">
      <rect x="0" y="0" width="145" height="48" rx="10" fill="#132238" stroke="#e100ff" stroke-width="1.5" opacity="0.9"/>
      <text x="72" y="29" text-anchor="middle" fill="#e100ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">🌐 Cloud CSMS</text>
    </g>

    <!-- Central Glowing Charging Hub Symbol -->
    <circle cx="140" cy="80" r="8" fill="#00f2fe" filter="url(#soft-glow)"/>
    <circle cx="250" cy="130" r="8" fill="#e100ff" filter="url(#soft-glow)"/>
    <circle cx="320" cy="60" r="8" fill="#00e676" filter="url(#soft-glow)"/>
  </g>

  <!-- Foreground Content Container (Ensures Title & Subtitle sit clearly in Foreground) -->
  <g transform="translate(70, 75)">
    <!-- Pill Tag Above Title -->
    <g>
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#00f2fe" stroke-width="1" opacity="0.9"/>
      <text x="140" y="21" text-anchor="middle" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title Lines -->
    <text x="0" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" letter-spacing="-0.5">
      Electric Vehicle Charging
    </text>
    <text x="0" y="145" fill="url(#electric-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="46" letter-spacing="-0.5">
      Management Platforms
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" fill="#a0aec0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20">
      SaaS Cloud Platforms, OCPP 1.6/2.0.1 Servers &amp; Open-Source Firmware
    </text>

    <!-- Feature Pills / Badges Below Subtitle -->
    <g transform="translate(0, 225)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="65" y="19" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔌 OCPP &amp; OCPI</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="140" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="212" y="19" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚗 Smart Charging</text>

      <!-- Pill 3 -->
      <rect x="294" y="0" width="140" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="364" y="19" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔋 ISO 15118 / V2G</text>

      <!-- Pill 4 -->
      <rect x="446" y="0" width="130" height="30" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="511" y="19" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 SaaS &amp; Open Source</text>
    </g>
  </g>
</svg>
